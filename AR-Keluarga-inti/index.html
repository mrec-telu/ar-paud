<!doctype html><html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>AR Keluarga Inti</title><meta itemprop="name" content="Empty Project"><meta name="twitter:title" content="Empty Project"><meta property="og:title" content="Empty Project"><meta property="og:site_name" content="Empty Project"><meta name="description" content="Start with a blank project."><meta itemprop="description" content="Start with a blank project."><meta property="og:description" content="Start with a blank project."><meta name="twitter:description" content="Start with a blank project."><script crossorigin="anonymous" src="./external/runtime/runtime.js"></script><script crossorigin="anonymous" src="./external/xr/xr.js" async="true" data-preload-chunks="face, slam"></script><style>/* RESET */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      position: fixed;
      inset: 0;
      background: transparent;
      font-family: Arial, sans-serif;
    }

    /* CANVAS AR */
    canvas {
      position: fixed !important;
      inset: 0 !important;
      width: 100% !important;
      height: 100% !important;
      object-fit: cover;
      z-index: 1 !important;
    }

    /* CONTAINER UI */
    #ui-container {
      position: fixed;
      bottom: calc(20px + env(safe-area-inset-bottom, 0px));
      left: 50%;
      transform: translateX(-50%);
      width: clamp(130px, 15vw, 210px);
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      z-index: 9999;
    }

    /* TOMBOL PENJELASAN */
    .tombol-ganti {
      width: 100%;
      height: auto;
      display: block;
      cursor: pointer;
      object-fit: contain;
      user-select: none;
      -webkit-user-drag: none;
    }

    /* TOMBOL KEMBALI */
    #back-container {
      position: fixed;
      top: calc(15px + env(safe-area-inset-top, 0px));
      left: calc(15px + env(safe-area-inset-left, 0px));
      width: 55px;
      z-index: 10000;
    }

    #btn-back {
      width: 100%;
      height: auto;
      display: block;
      cursor: pointer;
      object-fit: contain;
      user-select: none;
      -webkit-user-drag: none;
    }

    /* HP PORTRAIT */
    @media screen and (max-width: 600px) and (orientation: portrait) {
      #ui-container {
        width: 130px;
        bottom: calc(15px + env(safe-area-inset-bottom, 0px));
      }

      #back-container {
        width: 52px;
        top: calc(12px + env(safe-area-inset-top, 0px));
        left: calc(12px + env(safe-area-inset-left, 0px));
      }
    }

    /* TABLET PORTRAIT */
    @media screen and (min-width: 601px) and (orientation: portrait) {
      #ui-container {
        width: clamp(200px, 28vw, 300px);
        bottom: calc(25px + env(safe-area-inset-bottom, 0px));
      }

      #back-container {
        width: 85px;
        top: calc(25px + env(safe-area-inset-top, 0px));
        left: calc(25px + env(safe-area-inset-left, 0px));
      }
    }

    /* LANDSCAPE */
    @media screen and (orientation: landscape) {
      #ui-container {
        width: clamp(160px, 22vw, 300px);
        bottom: calc(15px + env(safe-area-inset-bottom, 0px));
      }

      #back-container {
        width: clamp(55px, 7vw, 100px);
        top: calc(15px + env(safe-area-inset-top, 0px));
        left: calc(15px + env(safe-area-inset-left, 0px));
      }
    }

    /* LANDSCAPE DENGAN TINGGI LAYAR PENDEK */
    @media screen and (orientation: landscape) and (max-height: 450px) {
      #ui-container {
        width: clamp(150px, 18vw, 240px);
        bottom: calc(8px + env(safe-area-inset-bottom, 0px));
      }

      #back-container {
        width: 55px;
        top: calc(8px + env(safe-area-inset-top, 0px));
        left: calc(8px + env(safe-area-inset-left, 0px));
      }
    }

    /* VIEWPORT DINAMIS */
    @supports (height: 100dvh) {
      html,
      body {
        height: 100dvh;
      }

      canvas {
        height: 100dvh !important;
      }
    }</style></head><body><div id="back-container"><a href="arpaud://launcher"><img id="btn-back" src="assets/btn_red_prev_1.png" alt="Back"></a></div><div id="ui-container"><img class="tombol-ganti" id="btn-penjelasan" src="assets/Frame_9.png" alt="Penjelasan"></div><audio id="audio-penjelasan" src=""></audio><script src="bundle.js"></script></body></html>
