<!doctype html><html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>AR Keluarga Besar</title><meta itemprop="name" content="Empty Project"><meta name="twitter:title" content="Empty Project"><meta property="og:title" content="Empty Project"><meta property="og:site_name" content="Empty Project"><meta name="description" content="Start with a blank project."><meta itemprop="description" content="Start with a blank project."><meta property="og:description" content="Start with a blank project."><meta name="og:description" content="Start with a blank project."><meta name="twitter:description" content="Start with a blank project."><script crossorigin="anonymous" src="./external/runtime/runtime.js"></script><script crossorigin="anonymous" src="./external/xr/xr.js" async="true" data-preload-chunks="face, slam"></script><style>/* =====================================
       RESET HALAMAN
       ===================================== */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent;
    }

    body {
      position: fixed;
      inset: 0;
    }

    @supports (height: 100dvh) {
      html,
      body {
        height: 100dvh;
      }
    }

    /* =====================================
       CANVAS AR FULLSCREEN
       ===================================== */
    canvas {
      position: fixed !important;
      inset: 0;
      width: 100% !important;
      height: 100% !important;
      object-fit: cover;
      z-index: 1 !important;
    }

    /* =====================================
       CONTAINER TOMBOL PENJELASAN
       POSISI: TENGAH BAWAH
       ===================================== */
    #ui-container {
      position: fixed;

      left: 50%;
      right: auto;
      top: auto;
      bottom: max(40px, env(safe-area-inset-bottom, 0px));

      width: clamp(130px, 15vw, 210px);
      height: auto;

      transform: translateX(-50%);

      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;

      z-index: 99999;
      pointer-events: none;
    }

    /* GAMBAR TOMBOL PENJELASAN */
    .tombol-ganti {
      display: block;

      width: 100%;
      max-width: none;
      height: auto;

      object-fit: contain;

      pointer-events: auto;
      cursor: pointer;
      user-select: none;
      -webkit-user-drag: none;

      filter: drop-shadow(
        0 4px 8px rgba(0, 0, 0, 0.4)
      );

      -webkit-tap-highlight-color: transparent;
      transition: transform 0.1s ease;
    }

    .tombol-ganti:active {
      transform: scale(0.9);
    }

    /* =====================================
       CONTAINER TOMBOL BACK
       POSISI: POJOK KIRI ATAS
       ===================================== */
    #back-container {
      position: fixed;

      top: max(20px, env(safe-area-inset-top, 0px));
      left: max(20px, env(safe-area-inset-left, 0px));
      right: auto;
      bottom: auto;

      width: 55px;
      height: auto;

      z-index: 100000;
    }

    /* LINK MENGIKUTI CONTAINER */
    #back-container a {
      display: block;
      width: 100%;
      height: auto;

      -webkit-tap-highlight-color: transparent;
    }

    /* GAMBAR BACK */
    #btn-back {
      display: block;

      width: 100%;
      max-width: none;
      height: auto;

      object-fit: contain;
      transform: rotate(0deg);
      transform-origin: center;

      filter: drop-shadow(
        0 3px 6px rgba(0, 0, 0, 0.4)
      );

      cursor: pointer;
      user-select: none;
      -webkit-user-drag: none;
      transition: transform 0.1s ease;
    }

    #btn-back:active {
      transform: scale(0.9);
    }

    /* =====================================
       HP PORTRAIT
       LEBAR LAYAR MAKSIMAL 600PX
       ===================================== */
    @media screen and (max-width: 600px) and (orientation: portrait) {
      #ui-container {
        width: 130px;
        bottom: max(25px, env(safe-area-inset-bottom, 0px));
      }

      #back-container {
        top: max(15px, env(safe-area-inset-top, 0px));
        left: max(15px, env(safe-area-inset-left, 0px));
        width: 52px;
      }
    }

    /* =====================================
       TABLET PORTRAIT
       ===================================== */
    @media screen and (min-width: 601px) and (orientation: portrait) {
      #ui-container {
        width: clamp(200px, 28vw, 300px);
        bottom: max(35px, env(safe-area-inset-bottom, 0px));
      }

      #back-container {
        width: 85px;
      }
    }

    /* =====================================
       LANDSCAPE: HP, TABLET, LAPTOP
       ===================================== */
    @media screen and (orientation: landscape) {
      #ui-container {
        width: clamp(160px, 22vw, 300px);
        bottom: max(25px, env(safe-area-inset-bottom, 0px));
      }

      #back-container {
        top: max(15px, env(safe-area-inset-top, 0px));
        left: max(15px, env(safe-area-inset-left, 0px));
        width: clamp(55px, 7vw, 100px);
      }
    }

    /* =====================================
       LANDSCAPE DENGAN TINGGI LAYAR PENDEK
       CONTOH: HP LANDSCAPE
       ===================================== */
    @media screen and (orientation: landscape) and (max-height: 450px) {
      #ui-container {
        width: clamp(150px, 18vw, 240px);
        bottom: max(12px, env(safe-area-inset-bottom, 0px));
      }

      #back-container {
        top: max(10px, env(safe-area-inset-top, 0px));
        left: max(10px, env(safe-area-inset-left, 0px));
        width: 55px;
      }
    }</style></head><body><div id="back-container"><a href="arpaud://launcher"><img id="btn-back" src="assets/btn_red_prev_1.png" alt="Back"></a></div><div id="ui-container"><img class="tombol-ganti" id="btn-penjelasan" src="assets/Frame_9.png" alt="Penjelasan"></div><audio id="audio-penjelasan" src=""></audio><script src="bundle.js"></script></body></html>
